<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FANUC TP Program Studio</title>
<meta name="theme-color" content="#b57e00">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23b57e00'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='14' font-weight='bold' fill='%231c1e21' text-anchor='middle'%3ETP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="header">
    <button class="btn subtle nav-toggle" id="btn-nav" aria-label="Program library"
            title="Hide the program library on every tab"
            aria-expanded="false" aria-controls="sidebar">☰</button>
    <div class="brand">
      <span class="mark">FANUC TP</span>
      <h1>Program Studio</h1>
      <span class="muted build" id="build-tag"></span>
    </div>
    <div class="spacer"></div>
    <div class="header-actions">
      <button class="btn" id="btn-phone" hidden
              title="Show a QR code for this bridge’s address — scan it to open the app on a phone or tablet">Phone</button>
      <button class="btn primary" id="btn-import">Import .LS files</button>
      <button class="btn" id="btn-folder">Import folder</button>
    </div>
    <input type="file" id="file-input" accept=".ls,.LS,.txt" multiple hidden>
    <input type="file" id="folder-input" webkitdirectory multiple hidden>
    <input type="file" id="compare-input" accept=".ls,.LS" multiple hidden>
    <input type="file" id="compare-dir-input" webkitdirectory multiple hidden>
  </header>

  <div class="nav-scrim" id="nav-scrim" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <div class="section-head">
      <span class="eyebrow">Sources</span>
      <span class="bridge-dot" id="bridge-dot" role="img" hidden></span>
    </div>
    <div class="connect">
      <div class="row" id="robot-row">
        <select id="robot-select"
                title="Robots this bridge has saved. Pick one to connect — its saved FTP user comes with it. A new IP, an FTP password, or a subnet scan live on the Robot tab."></select>
      </div>
      <div class="row" id="dir-row">
        <input id="dir-path" type="text" placeholder="Local folder path">
        <button class="btn" id="btn-dir-browse" title="Browse the bridge PC’s folders — its drives, mapped network drives included">…</button>
        <button class="btn" id="btn-dir">Open</button>
      </div>
      <div class="hint muted" id="server-hint"></div>
    </div>
    <div class="section-head">
      <span class="eyebrow">Program library</span>
      <span class="muted" id="lib-count"></span>
    </div>
    <div class="lib-ws" id="lib-ws-row" hidden>
      <select id="lib-ws"
              title="Each robot keeps its own program library. Picking one here only changes which library is shown — connecting to a robot switches to its library automatically."></select>
    </div>
    <div class="lib-filter">
      <input id="lib-filter" type="search" placeholder="Filter programs…"
             title="Type one or more words. Every word has to appear in the program name or its comment, in any order — “set task” matches both _SET_TASK and _TASK_SETUP.">
    </div>
    <div class="prog-list" id="prog-list"></div>
    <div class="footer">
      <button class="btn subtle" id="btn-clear">Clear library</button>
    </div>
  </aside>

  <main class="main">
    <nav class="tabs" id="tabs"></nav>
    <div class="pane" id="pane"></div>
  </main>
</div>

<script src="js/version.js"></script>
<script src="js/parser.js"></script>
<script src="js/analyzer.js"></script>
<script src="js/linter.js"></script>
<script src="js/flow.js"></script>
<script src="js/vaparse.js"></script>
<script src="js/diff.js"></script>
<script src="js/qr.js"></script>
<script src="js/tpshapes.js"></script>
<script src="js/tpsyntax.js"></script>
<script src="js/app.js"></script>
</body>
</html>
