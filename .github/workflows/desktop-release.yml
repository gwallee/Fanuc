name: Build desktop apps

# Windows and macOS installers must be built on their own runners:
# stamping a .exe icon needs Windows tooling (or Wine), and a .dmg
# needs macOS. This builds all three natively and attaches them to a
# release.
on:
  # "Run workflow" in the Actions tab publishes a release directly, so
  # cutting one never requires pushing a tag by hand.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v22.0.0)'
        required: true
        default: 'v22.0.0'
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false
  push:
    tags: ['v*']            # pushing a tag works too

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (.exe)
            target: --win
            artifacts: |
              desktop/dist/*.exe
          - os: macos-latest
            name: macOS (.dmg)
            target: --mac
            artifacts: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
          - os: ubuntu-latest
            name: Linux (AppImage, deb, rpm)
            target: --linux
            artifacts: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/*.rpm
              desktop/dist/*.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install build dependencies
        working-directory: desktop
        run: npm ci

      # rpm packaging needs the rpm tooling present on the runner.
      - name: Install rpm tooling
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build
        working-directory: desktop
        env:
          # Unsigned builds: no certificates are stored in this repo.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Unsigned builds cannot be verified by a signature, so publish
      # checksums people can check the downloads against.
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f ! -name 'SHA256SUMS.txt' -printf '%P\n' \
            | sort \
            | while read -r f; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          # Use the tag that triggered this run, or the one supplied to
          # the manual dispatch (the action creates it if it is new).
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: What the Wether ${{ github.event.inputs.version || github.ref_name }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Desktop builds of What the Wether.

            | Platform | File |
            | --- | --- |
            | Windows | `WhatTheWether-Setup-*.exe` (installer) or `WhatTheWether-Portable-*.exe` |
            | macOS | `WhatTheWether-*.dmg` |
            | Linux | `WhatTheWether-*.AppImage`, `.deb`, or `.rpm` |

            These builds are **unsigned**, so Windows SmartScreen and macOS
            Gatekeeper will warn on first launch. See the README for how to
            proceed past that, or build locally with `npm run dist`.

            `SHA256SUMS.txt` lists a checksum for every file. Verify a
            download with `sha256sum -c SHA256SUMS.txt` (Linux/macOS) or
            `Get-FileHash <file> -Algorithm SHA256` (Windows).
